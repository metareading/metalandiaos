<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#150f1f">
<title>LITE LEARNING – Център по Класическа Сугестопедия</title>
<!--
  MET-1268 · сглобяване v1 · тънка обвивка.
  Трите контрола (въртележка · албум · попълване) са байт-идентични и се зареждат в собствени рамки —
  всеки двигател държи своя canvas и своя един rAF. Рамките под първата се зареждат при приближаване.
-->
<style>
  :root{--bg:#150f1f;--ink:#f3e9d2;--gold:#e8c77e}
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth;background:var(--bg)}
  body{background:var(--bg);color:var(--ink);font:17px/1.5 Lora,Georgia,serif}
  .part{position:relative;height:100svh;min-height:560px}
  .part iframe{position:absolute;left:0;top:0;width:100%;height:calc(100% - 56px);border:0;display:block;background:var(--bg)}
  .next{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:2;
    color:var(--gold);text-decoration:none;font:600 14px/1 Lora,Georgia,serif;letter-spacing:.04em;
    padding:10px 18px;border:1px solid rgba(232,199,126,.5);border-radius:999px;background:var(--bg)}
  .next:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<section class="part" id="p1">
  <iframe src="carousel/" title="Въртележка с целия сайт" loading="eager"></iframe>
  <a class="next" href="#p2">Албум ↓</a>
</section>
<section class="part" id="p2">
  <iframe src="album/" title="Албум – събери думите от въртележката" loading="lazy"></iframe>
  <a class="next" href="#p3">Попълване ↓</a>
</section>
<section class="part" id="p3">
  <iframe src="fill/" title="Попълване – думите в изречението" loading="lazy"></iframe>
  <a class="next" href="#p1">↑ Въртележка</a>
</section>
</body>
</html>
