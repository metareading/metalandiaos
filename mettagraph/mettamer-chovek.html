<style>
/* ═══ PROTOTYPE (MET-895 · v4) — throwaway · храни Fable 5.1 Max · без tdd/suite ═══ */
:root{
  --bg:#0d0a08; --bg2:#15100c;
  --ink:#F0EBE0; --ink2:#d9d0bd; --mute:#a99e8a;
  --gold:#E8C77E; --gold2:#c9a25a; --gold3:#8a6a2e;
  --light:#fff5d6; --light2:#ffe9b8;
  --em:#6FB59A; --fire:#D4895E;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;
  --beat:1.6s;
}
*{margin:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:radial-gradient(120% 80% at 50% -6%,#1a130b 0%,#0d0a08 58%),var(--bg);
  color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  height:100dvh;overflow:hidden;position:fixed;inset:0;width:100%;
}
b,strong{color:#fff;font-weight:600}
button{font-family:inherit;cursor:pointer;color:inherit}

/* ── пълноекранна сцена ── */
.app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ── ъглов HUD (като кръговия Метамер) ── */
.hud{position:fixed;left:0;right:0;z-index:20;pointer-events:none;display:flex;align-items:flex-start;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 14px 0}
.hud.top{top:0}
/* по-дискретни pill-ове → заглавието „Нова Жена" не се крие зад тях */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 10px;font-size:.72rem;letter-spacing:.02em;background:rgba(20,15,10,.5);border:1px solid rgba(232,199,126,.24);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill b{font-family:var(--serif);font-weight:700;font-size:.9rem}
.pill.l{color:var(--light)}.pill.l b{color:var(--light);text-shadow:0 0 10px rgba(255,245,214,.55)}
.pill.g{color:var(--gold)}.pill.g b{color:var(--gold);text-shadow:0 0 10px rgba(232,199,126,.55)}
.hud .mid{position:absolute;left:50%;top:max(9px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center;white-space:nowrap}
.hud .mid .ttl{font-family:var(--serif);font-weight:600;font-size:1.08rem;color:#f7f1e3;line-height:1}
.hud .mid .sf{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--fire);font-weight:600;margin-top:2px}
.hud .mid .sf b{color:var(--gold);letter-spacing:.14em}

/* ── платното ── */
.stagewrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;flex:1;min-height:0}
.mettamap{position:relative}
.mm-stage{position:relative;height:min(97dvh,218vw);aspect-ratio:360/800;max-width:96vw;touch-action:pan-y}
.mm-stage>svg,.mm-stage>canvas{position:absolute;inset:0;width:100%;height:100%}
.mm-skel{z-index:1;display:block}
.mm-skel text{font-family:var(--serif);text-anchor:middle;dominant-baseline:central;pointer-events:none}

/* фигура (силует · аура · ромб · канали) — Тяло */
.mm-body{fill:rgba(232,199,126,.04);stroke:rgba(232,199,126,.32);stroke-width:1.2;stroke-linejoin:round}
.mm-aura{fill:none;stroke:rgba(255,245,214,.14);stroke-width:1}
.mm-spiral{fill:none;stroke:rgba(232,199,126,.13);stroke-width:1;stroke-linecap:round}
.mm-gdia{fill:rgba(255,245,214,.05);stroke:rgba(255,245,214,.55);stroke-width:1.3;stroke-linejoin:round}
.mm-spine{fill:none;stroke:rgba(232,199,126,.18);stroke-width:1.2}
/* обръч/октагон — Кръг */
.mm-rim{fill:none;stroke:rgba(232,199,126,.16);stroke-width:1}
.mm-oct{fill:none;stroke:rgba(232,199,126,.14);stroke-width:1}
.mm-guide{fill:none;stroke:rgba(255,245,214,.10);stroke-width:1}
/* ── Мандала v7 · вложена свещена геометрия: ромб(Метта)→квадрат(Мета)→триъгълници→кръг ── */
.mm-rhomb{fill:rgba(255,245,214,.05);stroke:rgba(255,245,214,.6);stroke-width:1.5;stroke-linejoin:round}
.mm-sq{fill:none;stroke:rgba(232,199,126,.52);stroke-width:1.7;stroke-linejoin:round}
.mm-tri{fill:rgba(232,199,126,.055);stroke:rgba(232,199,126,.44);stroke-width:1.5;stroke-linejoin:round}
.mm-arw{fill:none;stroke:rgba(232,199,126,.32);stroke-width:1.5;stroke-linecap:round}
.mm-arw.hd{fill:rgba(232,199,126,.5);stroke:none}
/* имена (Мандала) · четими от 60 см · тъмен halo (контраст ≥4.5:1) · котва през gL/gR (бие middle) */
.mm-skel.v-mand .nm{font-size:14px;font-weight:700;letter-spacing:.02em;fill:#f4ecd6;paint-order:stroke;stroke:rgba(9,6,3,.85);stroke-width:2.7px;stroke-linejoin:round}
.mm-skel.v-mand .mm-n[data-валута="светлина"] .nm{font-size:12px;fill:var(--light);stroke:rgba(9,6,3,.85)}
.mm-skel.v-mand .mm-n.lit .nm,.mm-skel.v-mand .mm-n.visit .nm{fill:#fff}
/* ── v8 · витрувианска фигура (класически вариант) + четими имена ── */
.mm-skel .mm-figure{fill:none;stroke:rgba(232,199,126,.5);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mm-skel .mm-figure .fill{fill:rgba(232,199,126,.06)}
.mm-skel .mm-figure .jt{fill:rgba(232,199,126,.55);stroke:none}
.mm-skel.v-vitr .nm,.mm-skel.v-vitrhd .nm{font-size:14px;font-weight:700;letter-spacing:.02em;fill:#f4ecd6;paint-order:stroke;stroke:rgba(9,6,3,.86);stroke-width:2.7px;stroke-linejoin:round}
.mm-skel.v-vitr .mm-n[data-валута="светлина"] .nm{font-size:12px;fill:var(--light);stroke:rgba(9,6,3,.86)}
.mm-skel.v-vitrhd .mm-n[data-валута="светлина"] .nm{fill:var(--light)}
.mm-skel.v-vitr .mm-n.lit .nm,.mm-skel.v-vitr .mm-n.visit .nm,.mm-skel.v-vitrhd .mm-n.lit .nm,.mm-skel.v-vitrhd .mm-n.visit .nm{fill:#fff}

/* ── ПРЕГРЪДКАТА (магията · Метта наметва клъстер от 3 Мета) ── */
.mm-emb path,.mm-emb line{transition:opacity .45s,stroke-opacity .45s}
.emb-wedge{opacity:.5}
.emb-wedge .w{fill:var(--light);fill-opacity:.05;stroke:rgba(255,245,214,.16);stroke-width:1}
.mm-emb .chan{fill:none;stroke:rgba(255,245,214,.22);stroke-width:1.3;stroke-linecap:round;opacity:.34}
.mm-skel .emb-on.emb-wedge{opacity:1}
.mm-skel .emb-on.emb-wedge .w{fill-opacity:.14;stroke:rgba(255,245,214,.5)}
.mm-skel .emb-on .chan{opacity:1;stroke:rgba(255,245,214,.75);stroke-width:2}

/* възли */
.mm-skel .mm-n{transition:opacity .4s}
.mm-skel .rbg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:2}
.mm-skel .ring{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linecap:round}
.mm-skel .mm-n[data-валута="светлина"] .ring{stroke:var(--light)}
.mm-skel .nm{font-weight:700;letter-spacing:.02em;fill:var(--ink2)}
.mm-skel .mm-n[data-валута="злато"] .nm{font-size:15px}
.mm-skel .mm-n[data-валута="светлина"] .nm{font-size:12.5px;fill:var(--light2)}
/* Тяло v6 · гутер-имена ЕДРИ и с висок контраст (четимост от 60 см = гейтът) */
.mm-skel.v-telo .nm.gut{font-size:16px;font-weight:700;letter-spacing:.03em;fill:#f3ead4;paint-order:stroke;stroke:rgba(10,7,4,.85);stroke-width:2.6px;stroke-linejoin:round}
.mm-skel.v-telo .mm-n[data-валута="светлина"] .nm.gut{fill:var(--light);stroke:rgba(10,7,4,.85)}
/* котва през КЛАС (бие .mm-skel text{text-anchor:middle}) → имената растат НАВЪН в гутера, не обратно към иконата */
.mm-skel .nm.gL{text-anchor:end}
.mm-skel .nm.gR{text-anchor:start}
.mm-skel .nmled{stroke:rgba(232,199,126,.3);stroke-width:1;stroke-dasharray:1.2 3;stroke-linecap:round}
.mm-skel .mm-n.lit .nmled,.mm-skel .mm-n.visit .nmled{stroke:rgba(255,245,214,.85)}
.mm-skel .mm-n.lit .nm.gut{fill:#fff;stroke-width:2.8px}
.mm-skel .tgm{fill:var(--gold);opacity:.9}
.mm-skel .tg2 .tgm{opacity:.82}
.mm-skel .mm-n.lit .tg2 .tgm{opacity:.95}
.mm-skel .mm-n.dim{opacity:.4}
.mm-skel .mm-n.lit .nm,.mm-skel .mm-n.visit .nm{fill:#fff}
.mm-skel .mm-n.lit .ring{stroke-width:3.6;filter:drop-shadow(0 0 5px rgba(232,199,126,.9))}
.mm-skel .mm-n.lit .mm-ico{filter:drop-shadow(0 0 6px rgba(255,240,190,.85))}
.mm-skel .mm-n.lit .tgm{opacity:1;filter:drop-shadow(0 0 4px rgba(232,199,126,.9))}
.mm-ico{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mm-n[data-валута="светлина"] .mm-ico{stroke:var(--light)}
.mm-ico .fl{fill:var(--gold);stroke:none}
.mm-n[data-валута="светлина"] .mm-ico .fl{fill:var(--light)}
/* ин-ян сърце (цялото) · бие */
.mm-skel .yy[data-сърце="цяло"]{transform-box:fill-box;transform-origin:50% 50%;animation:hbeat var(--beat) ease-in-out infinite}
@keyframes hbeat{0%,100%{transform:scale(1)}18%{transform:scale(1.08)}36%{transform:scale(1)}}

.mm-dust{z-index:2;pointer-events:none}
.mm-hit{z-index:3}
.mm-hit .mm-a{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.mm-hit .mm-a>*{fill:#E8C77E;fill-opacity:0;stroke:none;transition:fill-opacity .35s}
.mm-hit .mm-a.visit>*{fill:#fff5d6;fill-opacity:.05}
.mm-hit .mm-a.lit>*{fill-opacity:.1}
.mm-hit .mm-a:focus-visible>*{stroke:var(--gold);stroke-width:2;fill-opacity:.06}

/* ── карта на областта (Фокус на същия екран) ── */
#mmcard{position:fixed;inset:0;z-index:120;background:rgba(8,5,3,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;opacity:0;transition:opacity .35s}
#mmcard[hidden]{display:none}
#mmcard.show{opacity:1}
.mmc{--gd:#b8862f;--cink:#3a2a12;position:relative;width:min(94vw,380px);max-height:calc(100dvh - 24px);overflow:auto;border-radius:18px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:9px;font-family:var(--serif);color:var(--cink);background:radial-gradient(120% 90% at 50% 0%,#fff7e6 0%,#f3e6c4 45%,#e6d3a4 100%);box-shadow:0 0 0 2px var(--gd),0 0 0 5px rgba(255,240,190,.45),0 0 40px rgba(255,240,190,.3),0 24px 60px rgba(0,0,0,.6);transform:scale(.92);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
#mmcard.show .mmc{transform:scale(1)}
.mmc.светлина{--gd:#caa64e}
.mmc-x{position:absolute;right:10px;top:9px;z-index:9;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gd);background:#fffaf0;color:var(--cink);font-size:14px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mmc-tb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-right:34px}
.mmc-lvl{font-weight:700;font-size:1rem;letter-spacing:.05em;text-transform:uppercase}
.mmc-cur{font-size:.92rem;color:#7a5a1e;white-space:nowrap}
.mmc-art{position:relative;border:2px solid var(--gd);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,240,190,.6);aspect-ratio:4/5;max-height:46vh;background:#e9d9b3}
.mmc-art .mmc-imgs,.mmc-art .mmc-imgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mmc-art .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:italic;color:#8a6a2e;font-size:1rem;background:radial-gradient(circle at 50% 40%,#fff3d4,#e6d3a4)}
.mmc-art.ok .wait{display:none}
.mmc-bd{position:absolute;top:6px;right:8px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:rgba(42,31,18,.82);color:#ffe1a0;font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.mmc-nm{font-size:1.5rem;font-weight:700;line-height:1.05;text-align:center}
.mmc-ln{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:.82rem}
.mmc-ln span{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(120,90,30,.4);border-radius:20px;padding:3px 9px;background:rgba(255,250,235,.5)}
.mmc-ln span.no{opacity:.5}
.mmc-ln img{width:18px;height:18px;border-radius:50%;object-fit:cover}
.mmc-emb{font-size:.9rem;font-style:italic;text-align:center;color:#6a4a12;margin:0}
.mmc-guard{font-size:.85rem;font-style:italic;text-align:center;color:#6a4a12;margin:0}
.mmc-go{position:relative;margin:2px auto 0;display:inline-block;border:1.5px solid var(--gd);background:linear-gradient(120deg,#fffaf0,#efdcb0);color:var(--cink);border-radius:20px;padding:8px 16px;font-family:var(--serif);font-weight:700;font-size:.95rem;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:all .3s}
.mmc-go.on{background:linear-gradient(120deg,#2a1f16,#4a3520);color:#ffe1a0;border-color:#2a1f16}

/* ── долен HUD: подсказка + вариант-лента (throwaway switcher) ── */
.tap{position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;pointer-events:none;display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;opacity:.9;transition:opacity .5s}
.seen .tap{opacity:0}
.tap i{width:9px;height:9px;border:1.5px solid var(--gold);border-radius:50%;display:inline-block;animation:tp 1.6s ease-out infinite}
@keyframes tp{0%{box-shadow:0 0 0 0 rgba(232,199,126,.5)}100%{box-shadow:0 0 0 8px rgba(232,199,126,0)}}
.vbar{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:2px;background:rgba(18,13,9,.82);border:1px solid rgba(232,199,126,.34);border-radius:24px;padding:3px;box-shadow:0 6px 22px rgba(0,0,0,.5);opacity:.82}
.vbar button{border:none;background:transparent;border-radius:20px;padding:7px 10px;font-size:1.05rem;line-height:1;color:var(--gold)}
.vbar .lbl{min-width:132px;text-align:center;font-family:var(--serif);font-size:.9rem;color:var(--ink);letter-spacing:.02em;padding:0 4px}
.vbar .lbl b{color:var(--gold);font-weight:700}
.vbar .lbl small{display:block;font-family:var(--sans);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.vbar button:hover{background:rgba(232,199,126,.14)}

/* ═══ v13.2 · ГЕРОЙ-КУКЛА (дума 25.09 · HMM3 paperdoll · бюст до кръста в ЕДИН кръг · HD-подредба с 12 центъра · текст-панел под кръста · скролът е господар) ═══ */
html.kukla{overflow-x:hidden;overflow-y:auto}
html.kukla body{position:static;inset:auto;height:auto;min-height:100dvh;overflow:visible}   /* overflow САМО на html: overflow-x:hidden на body прави body скрол-контейнер и sticky умира */
html.kukla .app{position:sticky;inset:auto;top:0;height:100dvh;width:100%}
html.kukla .spacer{height:calc(13 * 70vh)}
html.kukla .tap{display:none}
.mm-skel .mm-cameo{fill:none;stroke:rgba(255,245,214,.45);stroke-width:1.3}
.mm-skel .mm-cameo2{fill:none;stroke:rgba(255,245,214,.10);stroke-width:1}
.mm-skel .mm-cloak{fill:rgba(232,199,126,.085);stroke:rgba(232,199,126,.3);stroke-width:1}
.mm-skel .mm-bust{fill:rgba(232,199,126,.06);stroke:rgba(232,199,126,.82);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.mm-skel .mm-hair{fill:rgba(232,199,126,.16);stroke:rgba(232,199,126,.7);stroke-width:1.2}
.mm-skel .mm-arm{fill:none;stroke:rgba(232,199,126,.8);stroke-width:1.9;stroke-linecap:round}
.mm-skel .mm-belt{fill:none;stroke:rgba(232,199,126,.4);stroke-width:1.2;stroke-linecap:round}
.mm-skel .mm-fib{fill:none;stroke:rgba(232,199,126,.28);stroke-width:1;stroke-linecap:round}
.mm-skel .slot{fill:rgba(232,199,126,.04);stroke:rgba(232,199,126,.46);stroke-width:.9}
.mm-skel .mm-n.lit .slot{stroke:rgba(255,245,214,.9);fill:rgba(232,199,126,.12)}
.mm-skel .face{opacity:.94;transition:opacity .4s}
.mm-skel .mm-n.dim .face{opacity:.35}
.mm-skel .badge{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mm-skel .badge .fl{fill:var(--gold);stroke:none}
.mm-skel .mm-n[data-валута="светлина"] .badge{stroke:var(--light)} .mm-skel .mm-n[data-валута="светлина"] .badge .fl{fill:var(--light)}
.mm-skel .badge-bg{fill:#0d0a08;stroke:rgba(232,199,126,.4);stroke-width:.7}
.mm-skel.v-kukla .nm{font-size:13.5px;font-weight:700;letter-spacing:.02em;fill:#f4ecd6;paint-order:stroke;stroke:rgba(9,6,3,.86);stroke-width:2.7px;stroke-linejoin:round}
.mm-skel.v-kukla .mm-n[data-валута="светлина"] .nm{font-size:11.5px;fill:var(--light)}
.mm-skel.v-kukla .mm-n.lit .nm,.mm-skel.v-kukla .mm-n.visit .nm{fill:#fff}
/* текст-панелът под кръста · сменя се при скрол · тап = картата · текст ИЗВЪН праха (MED-V2) */
.sfpanel{position:absolute;left:6%;right:6%;top:67.5%;bottom:2.5%;z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:5px;padding-top:8px}
.sfpanel[hidden]{display:none}
.sfpanel .sp-k{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--fire);font-weight:600}
.sfpanel .sp-k b{color:var(--gold);letter-spacing:.1em}
.sfpanel .sp-h{font-family:var(--serif);font-size:1.75rem;font-weight:700;color:#fff;line-height:1.05}
.sfpanel .sp-h.светлина{color:var(--light);text-shadow:0 0 12px rgba(255,245,214,.4)}
.sfpanel .sp-full{font-family:var(--serif);font-size:1.02rem;color:var(--ink2);font-style:italic}
.sfpanel .sp-t{font-size:.84rem;color:var(--ink2);line-height:1.45;max-width:340px;margin:2px 0 0}
.sfpanel .sp-t b{color:#fff}
.sfpanel .sp-go{pointer-events:auto;margin-top:6px;border:1px solid rgba(232,199,126,.55);background:rgba(232,199,126,.1);color:var(--gold);border-radius:20px;padding:7px 16px;font-family:var(--serif);font-weight:700;font-size:.95rem}
.sfpanel .sp-go[hidden]{display:none}
.sfpanel .sp-dots{display:flex;gap:5px;margin-top:8px}

const PLANE_H=vbH/100, CAM_FOV=50, CAM_Z=(PLANE_H/2)/Math.tan(CAM_FOV*DEG/2), CY_W=(AY-vbH/2)/100;

const VERT=`
uniform float uTime,uAssembly,uFocus,uFocusId,uGuestId,uNeedle,uBeat,uSizeBase,uPx;
uniform vec4 uEmb;
attribute vec3 aDust; attribute float aSeed,aClass,aData; attribute vec2 aAux; attribute vec3 aColor;
varying vec3 vColor; varying float vAlpha;

    vec3 d=hp-aDust; vec2 o=rot2(d.xy, tt*(0.12+0.22*aSeed)*aAux.y); vec3 h=aDust+vec3(o,d.z)*grow;
    p=mix(aDust,h,ase);
    float dim=mix(1.0, mix(0.3,1.7,isF), uFocus);
    alpha=(0.09+0.22*aData)*dim*(0.7+0.3*sin(tt*1.6+aSeed*6.28)); sz=0.9+0.5*aData+0.5*isF*uFocus; col*=1.0+0.35*isF*uFocus;
  } else if(c<3.5){

    vec3 q=vec3(R*cos(th),0.0,R*sin(th)); float tilt=mix(1.05,-0.95,ring)+0.25*sin(tt*0.27+ring*3.0);
    float ct=cos(tilt),st=sin(tilt); q=vec3(q.x, q.y*ct-q.z*st, q.y*st+q.z*ct); q.xy=rot2(q.xy, tt*0.12*(1.0-2.0*ring));
    p=q; alpha=(0.3+0.3*aSeed)*ase; sz=1.0+0.2*ring;
  } else if(c<4.5){
    if(aAux.x<0.5){ float th=aData+tt*0.09; float R=CAMR*(1.0+0.02*aAux.y); p=vec3(vec2(0.0,CAMY)+R*vec2(cos(th),sin(th)), aAux.y*0.12); alpha=0.10+0.16*aSeed; }

    vec2 sp=vec2(rr*sin(q), rr*cos(q))+aAux*0.03; float outside=step(CAMR-0.02, length(sp-vec2(0.0,CAMY)));

    float t=fract(aData+tt*0.22*(0.6+0.4*aSeed)); vec3 h=mix(hp,aDust,t); vec2 dir=normalize(aDust.xy-hp.xy+vec2(1e-4));
    h.xy+=vec2(-dir.y,dir.x)*aAux.y*0.03*(1.0+1.5*(1.0-on)); h.z+=0.04*sin(tt+aSeed*6.28);
    p=h; alpha=mix(0.05,0.34,on)*ase*(0.6+0.4*sin(t*6.28)); sz=mix(0.8,1.3,on); col=mix(col,vec3(1.0,0.96,0.84),on*0.5);
  } else {
    float y=mix(-0.26,0.82,aData), w=0.04*(1.0-aData)+0.006; vec2 q=rot2(vec2(aAux.x*w,y), -uNeedle);
    p=vec3(q, 0.08+0.05*sin(tt*3.0+aSeed*6.28)); alpha=(0.22+0.4*aSeed)*ase; sz=0.9+0.6*aData;
  }
  vec4 mv=modelViewMatrix*vec4(p,1.0);
  float ps=uSizeBase*mix(0.6,1.4,aSeed)*sz*(uPx*14.0/max(1.0,-mv.z));
  gl_PointSize=clamp(ps,0.7,6.5); gl_Position=projectionMatrix*mv;
  vColor=col; vAlpha=alpha;
}`;
const FRAG=`
varying vec3 vColor; varying float vAlpha;
void main(){ vec2 uv=gl_PointCoord-0.5; float m=1.0-smoothstep(0.08,0.5,length(uv)); if(m<0.01) discard; gl_FragColor=vec4(vColor, vAlpha*m); }`;
function initGL(){
  renderer.setPixelRatio(DPR); renderer.setClearColor(0x000000,0);
  const w=Math.max(1,stage.clientWidth), h=Math.max(1,stage.clientHeight); renderer.setSize(w,h,false);
  scene=new THREE.Scene(); camera=new THREE.PerspectiveCamera(CAM_FOV,w/h,0.1,60); camera.position.set(0,CY_W,CAM_Z); camera.lookAt(0,CY_W,0);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(home,3)); geo.setAttribute('aDust',new THREE.BufferAttribute(dust,3)); geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  geo.setAttribute('aClass',new THREE.BufferAttribute(cls,1)); geo.setAttribute('aData',new THREE.BufferAttribute(dat,1)); geo.setAttribute('aAux',new THREE.BufferAttribute(aux,2)); geo.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  uniforms={uTime:{value:0},uAssembly:{value:0},uFocus:{value:0},uFocusId:{value:-1},uGuestId:{value:-1},uNeedle:{value:0},uBeat:{value:0},uEmb:{value:new THREE.Vector4(0,0,0,0)},uSizeBase:{value:IS_MOBILE?0.95:1.0},uPx:{value:DPR}};
  material=new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:FRAG,uniforms,transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending});

}
const st={time:0,ass:0,t0:0,focus:0,fw:0,fn:0,tier:0,bad:0,pn:0};
function tick(now,dt,s){
  st.time+=dt; if(!st.t0) st.t0=now; const ap=Math.min(1,(now-st.t0)/1700); st.ass=1-Math.pow(1-ap,3);   /* интро-сглобяване (подписът на eidolon-а) */
  st.focus+=((s.фокус>=0?1:0)-st.focus)*Math.min(1,dt*5);
  uniforms.uTime.value=st.time; uniforms.uAssembly.value=st.ass; uniforms.uFocus.value=st.focus; uniforms.uFocusId.value=s.фокус; uniforms.uGuestId.value=s.гост;
  uniforms.uNeedle.value=s.ъгъл; uniforms.uBeat.value=(s.t%1.6)/1.6*TAU; uniforms.uEmb.value.set(s.emb[0],s.emb[1],s.emb[2],s.emb[3]);
  tiltGroup.rotation.set(-s.накл.x*DEG, s.накл.y*DEG, 0);                                                /* D · дълбочината: CSS rotateX(θ) ≡ three rotation.x(−θ) · rotateY(θ) ≡ rotation.y(θ) */
  renderer.render(scene,camera);
  /* FPS-политика (ADR 0099): под 45 → сваля тир (LOW_POWER брой) → пак под → 60% → пак под → 2D прахът + постерът · мери се след сглобяването (t>3s) на 2-сек прозорци */
  let wdt=st.pn?(now-st.pn)/1000:0; st.pn=now; if(wdt>1){ st.fw=0; st.fn=0; wdt=0; }   /* стенен часовник (dt е капнат) · пауза >1s (скрит таб) нулира прозореца */
  if(st.ass>=1&&(now-st.t0)>3000&&!s.отворена){ st.fw+=wdt; st.fn++; if(st.fw>=2){ const f=st.fn/st.fw; st.fw=0; st.fn=0; st.bad=f<45?st.bad+1:0;   /* хистерезис: 2 поредни лоши прозореца · не се мери при отворена карта (blur) · ревю v14 LOW */
    if(st.bad>=2){ st.bad=0; if(drawn>LOW){ drawn=LOW; st.tier=1; } else if(drawn>LOW*0.6){ drawn=Math.floor(LOW*0.6); st.tier=2; } else { st.tier=3; window.__мглСпри(false); return; }
      points.geometry.setDrawRange(0,drawn); if(window.console) console.info('eidolon тир ↓', st.tier, drawn, Math.round(f)+'fps'); } } }
}
const api={ tick, resize(w,h){ if(!renderer) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); },
  info(){ return {count:COUNT, drawn, tier:st.tier, mobile:IS_MOBILE, lowPower:LOW_POWER, dpr:DPR, assembled:+st.ass.toFixed(2), three:THREE.REVISION}; },
  тир(k){ drawn=Math.max(1000,Math.min(COUNT,k|0)); points.geometry.setDrawRange(0,drawn); return drawn; },
  /* verify: рендира + чете пиксели от камеята (същия task → буферът е цял без preserveDrawingBuffer) */
  проба(){ renderer.render(scene,camera); const gl=renderer.getContext(); const w=gl.drawingBufferWidth, h=gl.drawingBufferHeight, bw=Math.floor(w*0.5), bh=Math.floor(h*0.4); const buf=new Uint8Array(bw*bh*4); gl.readPixels(Math.floor(w*0.25),Math.floor(h*0.35),bw,bh,gl.RGBA,gl.UNSIGNED_BYTE,buf); let lit=0; for(let k=0;k<buf.length;k+=4){ if(buf[k]+buf[k+1]+buf[k+2]>40) lit++; } return {lit, of:bw*bh, w, h}; },
  загуби(){ const ext=renderer.getContext().getExtension('WEBGL_lose_context'); if(ext) ext.loseContext(); return !!ext; } };
/* context loss → постерът + 2D прахът поемат (не черен екран) · restore → dispose + re-init + пак регистрация */
canvas.addEventListener('webglcontextlost',e=>{ e.preventDefault(); window.__мглСпри(true); },false);
canvas.addEventListener('webglcontextrestored',()=>{ try{ initGL(); if(points) points.geometry.setDrawRange(0,drawn); st.t0=0; window.__мглРег(api); }catch(_){ } },false);   /* без dispose (обектите са на изгубения контекст · ревю v14 LOW) · тирът се пази */
try{ initGL(); }catch(e){ if(window.console) console.warn('eidolon init', e); return; }
window.__мгл=api; window.__мглРег(api);
})();
</script>
