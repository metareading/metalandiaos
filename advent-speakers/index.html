<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0b0b">
<title>TEDxSofia · адвент на лекторите 2026 · v2</title>
<style>
/* the look of /tedx-advent/ (advent.css, dark theme): TED red, white, near-black; local fonts only, no network */
:root{--bg:#0c0b0b;--bg2:#151313;--red:#E62B1E;--hot:#FF5A47;--ink:#f6f4f2;--mute:#9a9494;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--poster:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:Inter,-apple-system,'Helvetica Neue','Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  background:radial-gradient(120% 70% at 50% -10%,rgba(230,43,30,.20),transparent 60%),radial-gradient(90% 60% at 50% 115%,rgba(230,43,30,.10),transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
.mark{position:fixed;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;
  font-family:var(--serif);font-weight:700;color:var(--red);line-height:.78;letter-spacing:-.03em;opacity:.2}
.mark b{font-size:min(42vw,400px)} .mark span{font-size:min(19vw,176px);color:var(--ink);opacity:.55}
#wall{position:fixed;inset:0;z-index:1}
.day{position:absolute;border:0;padding:0;margin:0;border-radius:14px;cursor:pointer;overflow:hidden;font:inherit;color:inherit;
  background:rgba(12,11,11,.12);box-shadow:inset 0 0 0 1.5px rgba(230,43,30,.9),0 0 18px -8px rgba(230,43,30,.55);-webkit-tap-highlight-color:transparent}
.day:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.day .num{position:absolute;font-family:var(--serif);font-weight:700;font-variant-numeric:lining-nums;line-height:.8;letter-spacing:-.02em;color:var(--ink)}
.p-br .num{right:9%;bottom:9%} .p-tl .num{left:9%;top:11%} .p-tr .num{right:9%;top:11%} .p-bl .num{left:9%;bottom:9%}
.p-c .num{left:50%;top:50%;transform:translate(-50%,-50%)}
.day svg{position:absolute;width:44%;height:44%;fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.day svg .a{fill:var(--ink);stroke:var(--ink)}
.p-br svg{left:9%;top:9%} .p-tl svg{right:9%;bottom:9%} .p-tr svg{left:9%;bottom:9%} .p-bl svg{right:9%;top:9%}
.p-c svg{width:78%;height:78%;left:11%;top:11%;opacity:.32}
@media (hover:hover){.day:not(.open):hover{background:rgba(230,43,30,.12);box-shadow:inset 0 0 0 1.5px var(--hot),0 14px 30px -12px rgba(230,43,30,.6)}
  body.paused .day.open.sp:hover{box-shadow:inset 0 0 0 2.5px #fff,0 14px 34px -10px rgba(255,90,71,.9)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#speak{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#speak video{position:absolute;object-fit:cover;opacity:0;-webkit-mask-image:radial-gradient(ellipse 72% 78% at 50% 46%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 78% at 50% 46%,#000 62%,transparent 100%)}
#idea{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#over{position:fixed;inset:0;z-index:5;pointer-events:none}
.top{position:absolute;left:28px;top:14px}
.brand{margin:0;font-family:var(--serif);font-weight:700;color:var(--red);font-size:21px;line-height:1.1;letter-spacing:.01em}
.brand i{font-weight:600;color:var(--ink);font-size:19px;margin-left:8px}
.hint{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.hint b{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 1.8s ease-in-out infinite}
body.paused .hint b{background:#fff;box-shadow:0 0 10px #fff;animation:none}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
/* controls: pause and the profile chip (tap targets 44 px) */
.ctl{position:absolute;right:22px;top:11px;display:flex;gap:10px;pointer-events:auto;align-items:center}
#pp,#chip{height:44px;min-width:44px;border:0;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:9px;font:600 12.5px var(--sans);letter-spacing:.04em}
#pp{padding:0 18px 0 15px;color:#fff;background:var(--red);box-shadow:0 10px 26px -12px #8c1108}
#pp svg{width:14px;height:14px;fill:currentColor;flex:none} #pp .i-play{display:none}
body.paused #pp{background:#fff;color:#151313;box-shadow:0 0 0 0 rgba(255,255,255,.5);animation:ring 1.6s ease-out infinite}
body.paused #pp .i-play{display:block} body.paused #pp .i-pause{display:none}
@keyframes ring{to{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
#chip{padding:0 15px 0 13px;color:var(--ink);background:rgba(21,19,19,.78);box-shadow:inset 0 0 0 1px rgba(230,43,30,.6)}
#chip .n{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:0} #chip .n small{font-size:13px;color:var(--mute);font-weight:600}
#chip .c{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase} #chip .c i{font-style:normal} #chip .c b{color:var(--ink);font-size:13px;letter-spacing:0}
.coin{width:11px;height:11px;border-radius:50%;flex:none} .coin.m{box-shadow:inset 0 0 0 2px #fff} .coin.g{background:var(--red);box-shadow:0 0 8px rgba(230,43,30,.9)}
#chip.bump{animation:bump .5s ease-out} @keyframes bump{30%{transform:scale(1.09);box-shadow:inset 0 0 0 1.5px #fff}}
.foot{position:absolute;left:0;right:0;bottom:9px;text-align:center;color:var(--mute);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.foot b{color:var(--red);font-family:var(--serif);font-size:13px;letter-spacing:0;text-transform:none}
.nm{position:absolute;text-align:center;font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--hot);text-shadow:0 1px 6px #000,0 0 2px #000;white-space:nowrap;overflow:hidden}
/* the event windows' captions (as v1) */
.cap{position:absolute;text-align:center;display:flex;flex-direction:column;align-items:center}
.cap .kick{font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin-bottom:1.1em}
.cap .big{font-family:var(--serif);font-weight:700;line-height:1;color:#fff;letter-spacing:-.01em}
.cap .big em{font-style:italic;font-weight:600}
.cap .big .r{color:var(--red)}
.cap .big.logo{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-.03em}
.cap .big.logo sup{font-size:.56em;vertical-align:.62em;line-height:0}
.cap .big.logo .s{font-weight:400;margin-left:.1em}
.cap .sub{font-family:var(--serif);font-style:italic;font-weight:600;color:#fff;margin-top:.5em}
.w{display:inline-block;white-space:pre}
/* the poster: a speaker's line is the voice. Never on the face, never on the image. */
#poster{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
#poster .pq{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin-bottom:1em}
#poster .pq:before,#poster .pq:after{content:'';width:22px;height:1px;background:rgba(154,148,148,.6)}
#poster .ln{font-family:var(--poster);font-style:italic;font-weight:600;line-height:1.13;color:#fff;letter-spacing:-.005em;text-shadow:0 2px 22px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6)}
#poster .ln .qm{color:var(--red);font-style:normal}
#poster .who{display:flex;align-items:center;gap:14px;margin-top:1.15em;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#ff6a58}
#poster .who:before,#poster .who:after{content:'';width:30px;height:1.5px;background:var(--red)}
#poster .cr{margin-top:.6em;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#qup{position:absolute;display:flex;align-items:center;justify-content:center;gap:14px;line-height:1.3;font-family:var(--sans);font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#cfc9c6;text-shadow:0 1px 10px #000,0 0 2px #000;opacity:0;pointer-events:none;white-space:nowrap}
#qup:before,#qup:after{content:'';width:26px;height:1px;background:rgba(207,201,198,.6)}
#qup.q2{white-space:normal;text-align:center;letter-spacing:.12em}#qup.q2:before,#qup.q2:after{display:none}
#heroHit{position:absolute;display:none;pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;border-radius:18px}
#heroHit:focus-visible{outline:2px solid var(--hot)}
#fin{position:absolute;left:0;right:0;text-align:center;font-family:var(--serif);font-style:italic;font-weight:600;color:#fff;text-shadow:0 2px 20px #000,0 0 50px #000;opacity:0}
#fin b{font-style:normal;color:var(--red)}
/* sheets: a speaker's small landing, and the profile. The wall keeps breathing behind. */
.sheet{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(10,9,9,.7);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);user-select:text;-webkit-user-select:text}
.sheet.on{display:flex;animation:fade .28s ease-out} @keyframes fade{from{opacity:0}}
.card{position:relative;width:min(1080px,92vw);max-height:90vh;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#1b1616,#110e0e);
  box-shadow:inset 0 0 0 1.5px rgba(230,43,30,.75),0 40px 120px -30px #000,0 0 60px -20px rgba(230,43,30,.5)}
.sheet.on .card{animation:rise .34s cubic-bezier(.2,.8,.2,1)} @keyframes rise{from{transform:translateY(22px) scale(.985);opacity:0}}
.x{position:absolute;right:12px;top:12px;z-index:3;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:rgba(12,11,11,.7);color:#fff;font-size:17px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.land{display:grid;grid-template-columns:43% 1fr}
.land-pic{position:relative;background:#0c0b0b;min-height:420px}
.land-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.land-pic:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,rgba(17,14,14,.75));pointer-events:none}
.land-pic .pcr{position:absolute;left:14px;bottom:10px;z-index:2;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.land-body{padding:34px 40px 30px;overflow:auto;max-height:90vh;-webkit-overflow-scrolling:touch}
.kick{font-size:10.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.land-name{margin:.25em 0 .5em;font-family:var(--serif);font-weight:700;font-size:44px;line-height:1.02;letter-spacing:-.01em;color:#fff}
.land-badge{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.land-badge img{width:64px;height:64px;border-radius:50%;flex:none}
.land-badge .t{font-family:var(--serif);font-style:italic;font-size:24px;color:#fff;line-height:1} .land-badge .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--hot);margin-bottom:5px}
.land-line{margin:0 0 20px;padding:0 0 0 18px;border-left:2px solid var(--red);font-family:var(--poster);font-style:italic;font-weight:600;font-size:27px;line-height:1.18;color:#fff}
.art{padding:13px 0;border-top:1px solid rgba(154,148,148,.22)}
.art .aq{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.art .at{font-family:var(--poster);font-size:19px;line-height:1.32;color:var(--ink)}
.slot{position:relative;margin:18px 0 6px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:radial-gradient(90% 120% at 50% 0,rgba(230,43,30,.16),transparent 70%),#0e0c0c;box-shadow:inset 0 0 0 1px rgba(230,43,30,.45)}
.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
.slot.has video{display:block} .slot.has .ph{display:none}
.slot .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mute);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
.slot .ph i{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(230,43,30,.8);display:flex;align-items:center;justify-content:center;animation:pulse 2.6s ease-in-out infinite}
.slot .ph i:after{content:'';border-left:12px solid var(--red);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.slot .ph span{font-family:var(--serif);font-style:italic;font-size:19px;letter-spacing:0;text-transform:none;color:var(--ink)}
.go{margin-top:16px;height:48px;padding:0 26px;border:0;border-radius:999px;cursor:pointer;background:var(--red);color:#fff;font:600 14px var(--sans);letter-spacing:.04em;box-shadow:0 12px 30px -12px #8c1108}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lnk{background:none;border:0;padding:12px 4px;margin-top:16px;color:var(--mute);font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
/* the profile */
.prof{padding:32px 38px 28px;overflow:auto;max-height:90vh;width:min(860px,92vw)}
.prof h2{margin:.2em 0 .1em;font-family:var(--serif);font-weight:700;font-size:38px;color:#fff;line-height:1.05} .prof h2 em{color:var(--red);font-style:normal}
.cur{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 20px}
.cur div.cc{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(154,148,148,.22)}
.cur .h{display:flex;align-items:baseline;gap:9px;font-family:var(--serif);font-size:30px;font-weight:700;color:#fff;line-height:1} .cur .h .coin{width:15px;height:15px;align-self:center} .cur .h small{font-size:15px;color:var(--mute);font-weight:600}
.cur .l{margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--hot)} .cur p{margin:4px 0 0;font-size:12.5px;line-height:1.35;color:var(--mute)}
.badges{display:grid;grid-template-columns:repeat(8,1fr);gap:14px 8px}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;min-height:44px;cursor:default}
.bd i{position:relative;width:100%;max-width:74px;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(154,148,148,.3);border:0;
  font-family:var(--serif);font-style:normal;font-weight:700;font-size:20px;color:rgba(154,148,148,.55)}
.bd.got i{box-shadow:0 0 0 1.5px rgba(230,43,30,.9),0 6px 18px -8px rgba(230,43,30,.9)} .bd.got.sp{cursor:pointer}
.bd img{width:100%;height:100%;border-radius:50%;display:block}
.bd.read i:after{content:'';position:absolute;right:-1px;top:-1px;width:13px;height:13px;border-radius:50%;background:#151313;box-shadow:inset 0 0 0 2.5px #fff}
.bd span{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1;color:var(--ink);white-space:nowrap} .bd:not(.got) span{color:rgba(154,148,148,.45)}
/* phone: a vertical screen */
body.port .top{left:14px;top:12px} body.port .brand{font-size:19px} body.port .brand i{display:block;margin:1px 0 0;font-size:14px;line-height:1.15;max-width:calc(100vw - 222px)} body.port .hint{display:none}
body.port .ctl{right:10px;top:8px;gap:8px} body.port #pp{padding:0;justify-content:center;width:44px} body.port #pp span{display:none}
body.port #chip{padding:0 12px 0 11px;gap:8px} body.port #chip .c i{display:none}
body.port .foot{font-size:8.5px;bottom:calc(6px + env(safe-area-inset-bottom))}
body.port .sheet{align-items:flex-end;-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(10,9,9,.62)}
body.port .card{width:calc(100vw - 16px);max-height:none;height:calc(100% - 66px);margin-bottom:8px;border-radius:20px;overflow:auto;-webkit-overflow-scrolling:touch}
body.port .land{display:block} body.port .land-pic{min-height:0;height:52vh} body.port .land-body{max-height:none;overflow:visible;padding:20px 20px 26px}
body.paused:not(.port) #poster{background:radial-gradient(closest-side,rgba(10,9,9,.8),rgba(10,9,9,.55) 60%,transparent)}
body.port #poster .pq{margin-bottom:.6em} body.port #poster .who{margin-top:.75em}
body.port .card .row{position:sticky;bottom:0;z-index:3;margin:0 -20px -26px;padding:26px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(17,14,14,0),#110e0e 46%)}
body.port .land-name{font-size:34px} body.port .land-line{font-size:23px} body.port .art .at{font-size:18px}
body.port .prof{max-height:none;padding:22px 16px 24px;width:auto} body.port .prof h2{font-size:30px} body.port .badges{grid-template-columns:repeat(4,1fr);gap:14px 6px} body.port .cur{gap:8px} body.port .cur div.cc{padding:12px}
@media (prefers-reduced-motion:reduce){.hint b,#pp,.slot .ph i{animation:none!important}}
</style>
</head>
<body>
<div class="mark" aria-hidden="true"><b>TEDx</b><span>Sofia</span></div>
<main id="wall" aria-label="24 прозореца"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="speak" aria-hidden="true"></div>
<canvas id="idea" aria-hidden="true"></canvas>
<div id="over">
  <header class="top"><p class="brand">TEDxSofia<i>адвент на лекторите 2026</i></p><div class="hint"><b></b><span id="hint">Отвори всички 24 прозореца</span></div></header>
  <div class="ctl">
    <button id="chip" type="button" aria-label="Профил: значки, смисъл, даване"><span class="n"><span id="cN">0</span><small>/24</small></span>
      <span class="c"><b class="coin m"></b><i>смисъл</i><b id="cM">0</b></span><span class="c"><b class="coin g"></b><i>даване</i><b id="cG">0</b></span></button>
    <button id="pp" type="button" aria-label="Пауза"><svg class="i-pause" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="1" width="4" height="12" rx="1"/><rect x="8.5" y="1" width="4" height="12" rx="1"/></svg>
      <svg class="i-play" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.2v11.6a.6.6 0 0 0 .9.5l9-5.8a.6.6 0 0 0 0-1l-9-5.8a.6.6 0 0 0-.9.5z"/></svg><span id="ppL">Пауза</span></button>
  </div>
  <div id="names"></div>
  <div class="cap" id="capL"></div><div class="cap" id="capR"></div>
  <div id="poster"></div>
  <button id="heroHit" type="button" aria-label="Страницата на лектора"></button>
  <div id="fin"></div>
  <div class="foot">без звук · <b>TEDxSofia</b> 2026</div>
</div>
<!-- a speaker's small landing (layer 1). A second layer can mount in .layer2 later; it is empty on purpose. -->
<div class="sheet" id="land" role="dialog" aria-modal="true" aria-label="Страница на лектора">
  <div class="card land">
    <button class="x" type="button" data-close="land" aria-label="Затвори">✕</button>
    <div class="land-pic"><img id="lPic" alt=""><div class="pcr" id="lCr"></div></div>
    <div class="land-body">
      <div class="kick" id="lKick"></div>
      <h2 class="land-name" id="lName"></h2>
      <div class="land-badge"><img id="lBadge" alt=""><div><div class="k">значка</div><div class="t" id="lTopic"></div></div></div>
      <blockquote class="land-line" id="lLine"></blockquote>
      <div id="lArts"></div>
      <div class="slot" id="lSlot"><video id="lVid" playsinline controls preload="metadata"></video><div class="ph"><i></i><span>видео идва на 21.11</span>интро от лектора</div></div>
      <div class="layer2" id="lLayer2" data-layer="2" hidden></div>
      <div class="row"><button class="go" type="button" id="lGo">Продължи ▶</button></div>
    </div>
  </div>
</div>
<div class="sheet" id="prof" role="dialog" aria-modal="true" aria-label="Профил">
  <div class="card prof">
    <button class="x" type="button" data-close="prof" aria-label="Затвори">✕</button>
    <div class="kick">твоят профил</div>
    <h2><span id="pN">0</span> от 24 <em>значки</em></h2>
