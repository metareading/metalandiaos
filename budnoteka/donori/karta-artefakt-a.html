const LOW_POWER=(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=2;
let COUNT=IS_MOBILE?(LOW_POWER?18000:30000):(LOW_POWER?34000:58000);
if(И.ВЕРСИЯ==='A') COUNT=Math.round(COUNT*0.4);   /* A: прахът е акцент върху картината */
const DPR=Math.min(window.devicePixelRatio||1,2);
const canvas=document.getElementById('gl'), stage=document.getElementById('stage'), art=document.getElementById('art'), plaque=document.getElementById('plaque'), sampler=document.getElementById('sampler');
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const rand=mulberry32(0x4B415254);
const gauss=()=>{ let u=0,v=0; while(u===0)u=rand(); while(v===0)v=rand(); return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v); };

/* ── СВГ → ТОЧКИ (Eidolon: равномерно по дължина на дъгата, не по параметър) · тръба около всяка линия · площ за data-fill ── */
function сампълвай(svg,count){ sampler.innerHTML=svg; const els=[...sampler.querySelectorAll('[data-w]')], W=els.map(e=>+e.dataset.w), tot=W.reduce((a,b)=>a+b,0)||1;
  const pos=new Float32Array(count*3), cls=new Float32Array(count), dat=new Float32Array(count); let i=0;
  els.forEach((e,ei)=>{ const n=ei===els.length-1?count-i:Math.round(count*W[ei]/tot), c=+(e.dataset.c||0), r=(+e.dataset.r||1.5)/100, tag=e.tagName.toLowerCase();
    if(e.dataset.fill!=null&&(tag==='circle'||tag==='ellipse')){ const cx=+e.getAttribute('cx')/100, cy=-(+e.getAttribute('cy'))/100, rx=+(e.getAttribute('r')||e.getAttribute('rx'))/100, ry=+(e.getAttribute('r')||e.getAttribute('ry'))/100;
      for(let k=0;k<n&&i<count;k++,i++){ const u=Math.sqrt(rand()), a=rand()*TAU; pos[i*3]=cx+rx*u*Math.cos(a); pos[i*3+1]=cy+ry*u*Math.sin(a); pos[i*3+2]=(rand()-0.5)*r*2; cls[i]=c; dat[i]=u; } return; }
    const L=e.getTotalLength(), S=Math.max(24,Math.min(400,Math.round(L/1.2))), P=new Float32Array((S+1)*2);
    for(let s=0;s<=S;s++){ const q=e.getPointAtLength(L*s/S); P[s*2]=q.x/100; P[s*2+1]=-q.y/100; }
    for(let k=0;k<n&&i<count;k++,i++){ const t=rand()*S, s0=Math.min(S-1,Math.floor(t)), f=t-s0, x=P[s0*2]+(P[s0*2+2]-P[s0*2])*f, y=P[s0*2+1]+(P[s0*2+3]-P[s0*2+1])*f;
      let tx=P[s0*2+2]-P[s0*2], ty=P[s0*2+3]-P[s0*2+1]; const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
      const th=rand()*TAU, rr=r*(rand()<0.8?Math.sqrt(rand()):1), cs=Math.cos(th)*rr; pos[i*3]=x-ty*cs; pos[i*3+1]=y+tx*cs; pos[i*3+2]=Math.sin(th)*rr; cls[i]=c; dat[i]=t/S; } });
  sampler.innerHTML=''; return {pos,cls,dat,n:i}; }
const кеш=new Map();
function облак(k,count){ const key=k+'·'+count; if(кеш.has(key)) return кеш.get(key); const a=И.АРТЕФАКТИ.find(x=>x.ключ===k), o=сампълвай(a.svg,count); кеш.set(key,o); return o; }
function цяло(count){ const key='цяло·'+count; if(кеш.has(key)) return кеш.get(key); const n=Math.floor(count/И.АРТЕФАКТИ.length), pos=new Float32Array(count*3), cls=new Float32Array(count), dat=new Float32Array(count); let i=0;
  И.АРТЕФАКТИ.forEach((a,k)=>{ const o=облак(a.ключ,n), ang=Math.PI/2+k*TAU/И.АРТЕФАКТИ.length, cx=0.62*Math.cos(ang), cy=0.62*Math.sin(ang);
    for(let q=0;q<o.n&&i<count;q++,i++){ pos[i*3]=cx+o.pos[q*3]*0.36; pos[i*3+1]=cy+o.pos[q*3+1]*0.36; pos[i*3+2]=o.pos[q*3+2]*0.36; cls[i]=o.cls[q]; dat[i]=o.dat[q]; } });
  const o={pos,cls,dat,n:i}; кеш.set(key,o); return o; }

/* ── буферите (ЕДНА геометрия) · aHome=position (целта) · aFrom (старата цел) · aDust (покой) · aSeed · aClass · aData · aSize ── */
const home=new Float32Array(COUNT*3), from=new Float32Array(COUNT*3), dust=new Float32Array(COUNT*3), seed=new Float32Array(COUNT), cls=new Float32Array(COUNT), dat=new Float32Array(COUNT), size=new Float32Array(COUNT);
for(let i=0;i<COUNT;i++){ seed[i]=rand(); size[i]=0.6+0.8*rand(); let x,y,z;
  if(И.ВЕРСИЯ==='A'&&rand()<0.7){ /* A: дъхът е пръстен около прозореца на картината */ const u=rand()*4, hw=1.16, hh=1.3; let px,py; if(u<1){px=-hw+2*hw*u;py=hh;} else if(u<2){px=hw;py=hh-2*hh*(u-1);} else if(u<3){px=hw-2*hw*(u-2);py=-hh;} else {px=-hw;py=-hh+2*hh*(u-3);} x=px+gauss()*0.07; y=py+gauss()*0.07; z=gauss()*0.15; }
  else { const a=rand()*TAU, v=2*rand()-1, sv=Math.sqrt(1-v*v), r=1.75*Math.pow(rand(),0.55); x=r*sv*Math.cos(a); y=r*v; z=r*sv*Math.sin(a)*0.6; }
  dust[i*3]=x; dust[i*3+1]=y; dust[i*3+2]=z; home[i*3]=x; home[i*3+1]=y; home[i*3+2]=z; }
from.set(home);
let nAct=0;
function loadHome(o){ from.set(home); home.set(o.pos.subarray(0,o.n*3)); for(let i=o.n;i<COUNT;i++){ home[i*3]=dust[i*3]; home[i*3+1]=dust[i*3+1]; home[i*3+2]=dust[i*3+2]; cls[i]=0; dat[i]=1; }
  cls.set(o.cls.subarray(0,o.n)); dat.set(o.dat.subarray(0,o.n)); nAct=o.n; ['position','aFrom','aClass','aData'].forEach(a=>geo.attributes[a].needsUpdate=true); }

const VERT=`
#define aHome position
uniform float uTime,uPx,uSizeBase,uAssembly,uMorph,uFocus,uSwirl,uGlow,uAcc; uniform vec2 uPointer; uniform vec3 uArt,uRip;
uniform vec4 uT[4]; uniform vec4 uR[4]; uniform vec2 uP[4]; uniform vec3 uCol[4];
attribute vec3 aFrom,aDust; attribute float aSeed,aClass,aData,aSize;
varying vec3 vColor; varying float vAlpha;
const vec3 LIGHT=vec3(1.0,0.961,0.839);
float stag(float m,float s,float w){ float t=clamp((m-s*w)/(1.0-w),0.0,1.0); return t*t*(3.0-2.0*t); }
vec3 curl(vec3 p,float t){ return vec3(sin(p.y*1.3+t*0.5)+cos(p.z*1.1-t*0.4), sin(p.z*1.2-t*0.45)+cos(p.x*1.4+t*0.5), sin(p.x*1.1+t*0.4)+cos(p.y*1.3-t*0.5)); }
void main(){
  int c=int(aClass+0.5); float tt=uTime; vec4 T=uT[c]; vec4 R=uR[c]; vec2 pv=uP[c];
  vec2 q=aHome.xy-pv; float cs=cos(T.z), sn=sin(T.z); q=vec2(q.x*cs-q.y*sn,q.x*sn+q.y*cs)*T.w+pv+T.xy;                 /* ПОТОКЪТ: клас-транформ около пивота */
  vec3 h=vec3(q, aHome.z+uRip.x*R.w*sin(aData*uRip.y-tt*uRip.z));                                                           /* + вълни по aData */
  float wm=stag(uMorph,aSeed,0.4); vec3 hm=mix(aFrom,h,wm); float arc=sin(wm*3.14159);                                        /* МОРФЪТ: старата цел → новата, по дъга */
  hm.z+=arc*(0.25+0.45*aSeed); hm.xy+=arc*0.18*vec2(sin(aSeed*6.28+tt),cos(aSeed*6.28+tt));
  vec3 d=aDust+0.16*curl(aDust*1.1,tt*0.6)*(1.0-0.5*uFocus);                                                                  /* ПРАХЪТ: curl-поле в покой */
  float wa=stag(uAssembly,aSeed,0.45); vec3 p=mix(d,hm,wa);                                                                   /* СГЛОБЯВАНЕТО: seed-разсрочен lerp · облакът вдишва във формата */
  p+=wa*0.008*vec3(sin(tt*0.9+aSeed*9.0),cos(tt*0.7+aSeed*7.0),sin(tt*0.8+aSeed*5.0));                                        /* сглобеният диша · никога статичен */
  p.xy+=R.y*wa*vec2(sin(tt*37.0+aSeed*50.0),cos(tt*41.0+aSeed*30.0));
  float fly=max(sin(3.14159*wa),arc*wa);                                                                                      /* златните нишки: зърното в полет свети */
  vec2 toP=p.xy-uPointer; float g=exp(-dot(toP,toP)*0.35)*uSwirl; vec2 tang=normalize(vec2(-toP.y,toP.x)+vec2(1e-4)); p.xy+=tang*g*mix(0.6,0.12,wa);   /* пръстът: Gauss·swirl */
  vec3 w=vec3(uArt.xy+p.xy*uArt.z, p.z*uArt.z);
  vec4 mv=modelViewMatrix*vec4(w,1.0);
  float sz=aSize*uArt.z*mix(1.0,0.72,uFocus)*(1.0+g*1.2)*mix(0.9,1.0,wa)*(1.0+R.z*0.3)*(1.0+0.45*fly)*uAcc;
  float ps=uSizeBase*sz*(uPx*10.0/max(1.0,-mv.z));
  gl_PointSize=clamp(ps,0.75,7.0); gl_Position=projectionMatrix*mv;
  vec3 col=mix(uCol[c],LIGHT,clamp(R.z*0.7+uGlow*0.6+uFocus*0.25+0.6*fly,0.0,1.0));
  float a=mix(0.10+0.25*step(0.7,aSeed),0.42,wa)*(0.82+0.18*sin(tt*1.6+aSeed*6.28));
  a*=mix(1.0,step(aData,R.x+0.001),wa); a*=1.0+uFocus*0.5+uGlow*0.9+R.z*0.6+0.9*fly; a*=uAcc;
  vColor=col; vAlpha=a;
}`;
const FRAG=`varying vec3 vColor; varying float vAlpha;
void main(){ vec2 uv=gl_PointCoord-0.5; float m=1.0-smoothstep(0.08,0.5,length(uv)); if(m*vAlpha<0.01) discard; gl_FragColor=vec4(vColor, vAlpha*m); }`;

/* ── renderer · сцена · камера (гледа право в равнината z=0 · полу-височина 4 единици) ── */
let renderer=null; try{ renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:true,powerPreference:'high-performance'}); }catch(e){ renderer=null; }
if(!renderer) return;                                           /* без WebGL → постерът */
renderer.debug.onShaderError=function(){ спри(); };
renderer.setPixelRatio(DPR); renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(36,1,0.1,60);
const CAM_D=4/Math.tan(18*Math.PI/180); camera.position.set(0,0,CAM_D); camera.lookAt(0,0,0);
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(home,3)); geo.setAttribute('aFrom',new THREE.BufferAttribute(from,3)); geo.setAttribute('aDust',new THREE.BufferAttribute(dust,3));
geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1)); geo.setAttribute('aClass',new THREE.BufferAttribute(cls,1)); geo.setAttribute('aData',new THREE.BufferAttribute(dat,1)); geo.setAttribute('aSize',new THREE.BufferAttribute(size,1));
const U={uTime:{value:0},uPx:{value:DPR},uSizeBase:{value:IS_MOBILE?0.95:1.0},uAssembly:{value:0},uMorph:{value:1},uFocus:{value:0},uSwirl:{value:0},uGlow:{value:0},uAcc:{value:И.ВЕРСИЯ==='A'?1.3:1.0},
  uPointer:{value:new THREE.Vector2(0,-9)},uArt:{value:new THREE.Vector3(0,1,1.5)},uRip:{value:new THREE.Vector3(0,0,0)},
  uT:{value:[0,1,2,3].map(()=>new THREE.Vector4(0,0,0,1))},uR:{value:[0,1,2,3].map(()=>new THREE.Vector4(1,0,0,0))},uP:{value:[0,1,2,3].map(()=>new THREE.Vector2())},uCol:{value:[0,1,2,3].map(()=>new THREE.Color('#E8C77E'))}};
const material=new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:FRAG,uniforms:U,transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending});
const points=new THREE.Points(geo,material); points.frustumCulled=false; scene.add(points);   /* frustumCulled=false: истинските позиции живеят в шейдъра */

/* ── прозорецът на артефакта: DOM-правоъгълникът на #art (без плакета) → uArt = център + мащаб (1 локална единица = 44 % от по-малката страна) ── */
function разположи(){ const c=canvas.getBoundingClientRect(), a=art.getBoundingClientRect(), ph=plaque.getBoundingClientRect().height*0.55; if(!c.width||!c.height||!a.width) return;
  const ah=a.height-ph, ax=(a.left+a.width/2-c.left)/c.width, ay=(a.top+ah/2-c.top)/c.height, halfW=4*c.width/c.height, ppu=c.height/8;
  U.uArt.value.set((ax*2-1)*halfW,(1-ay*2)*4,0.44*Math.min(a.width,ah)/ppu); }
function локал(cx,cy){ const c=canvas.getBoundingClientRect(), nx=(cx-c.left)/c.width*2-1, ny=1-(cy-c.top)/c.height*2, A=U.uArt.value; return [(nx*4*c.width/c.height-A.x)/A.z,(ny*4-A.y)/A.z]; }
function палитра(a){ a.палитра.forEach((h,i)=>U.uCol.value[i].set(h)); a.пивоти.forEach((p,i)=>U.uP.value[i].set(p[0],p[1])); }

/* ── тайминги (тайм-туийни · cubic in-out) · състояние ── */
const st={time:0,last:0,t0:0,running:false,visible:true,k:0,арт:И.АРТЕФАКТИ[0],sealed:false,ръчно:false,after:null,focus:0,focusT:0,swirl:0,glow:0,pl:null,pt:0,drawn:COUNT,tier:0,bad:0,fw:0,fn:0,fps:0,pn:0,
  asm:{v:0,a:0,b:0,t0:0,dur:1,on:false}, mor:{v:1,a:1,b:1,t0:0,dur:1,on:false}};
function tw(o,b,dur){ o.a=o.v; o.b=b; o.t0=performance.now(); o.dur=Math.max(0.01,dur); o.on=true; }
function tick(o,now){ if(!o.on) return; const u=Math.min(1,(now-o.t0)/1000/o.dur), e=u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2; o.v=o.a+(o.b-o.a)*e; if(u>=1) o.on=false; }
const LOW=IS_MOBILE?18000:34000;

/* ── ЕДИН rAF · диригентът · заспива при скрит таб · FPS-политика (ADR 0099): <45 в 2 поредни 2-сек прозореца → тир ↓ → 60 % → постер ── */
function кадър(now){ if(!st.running) return; const dt=Math.min(0.05,st.last?(now-st.last)/1000:0.016); st.last=now; st.time+=dt; if(!st.t0) st.t0=now;
  tick(st.asm,now); tick(st.mor,now); st.focus+=(st.focusT-st.focus)*Math.min(1,dt*6); st.swirl*=Math.exp(-dt*3); st.glow=Math.max(0,st.glow-dt/0.8);
  if(!st.mor.on&&st.after){ const f=st.after; st.after=null; f(); }
  if(!st.asm.on&&st.asm.b===1&&st.asm.v>=0.999&&!st.sealed){ st.sealed=true; st.glow=1; И.прибрано(st.k,st.ръчно); }   /* печатът: сглобено → в тестето */
  const F=И.ПОТОЦИ[st.арт.поток](st.time,st.арт); for(let c=0;c<4;c++){ U.uT.value[c].set(F.T[c][0],F.T[c][1],F.T[c][2],F.T[c][3]); U.uR.value[c].set(F.R[c][0],F.R[c][1],F.R[c][2],F.R[c][3]); } U.uRip.value.set(F.рип[0],F.рип[1],F.рип[2]); U.uSizeBase.value=(IS_MOBILE?0.95:1.0)*(F.размер||1);
  U.uTime.value=st.time; U.uAssembly.value=st.asm.v; U.uMorph.value=st.mor.v; U.uFocus.value=st.focus; U.uSwirl.value=st.swirl; U.uGlow.value=st.glow;
  renderer.render(scene,camera);
  let wdt=st.pn?(now-st.pn)/1000:0; st.pn=now; if(wdt>1){ st.fw=0; st.fn=0; wdt=0; }
  if(document.visibilityState==='visible'){ st.fw+=wdt; st.fn++; if(st.fw>=2){ st.fps=st.fn/st.fw; st.fw=0; st.fn=0; if((now-st.t0)>3000){ st.bad=st.fps<45?st.bad+1:0;
    if(st.bad>=2&&!NO_TIER){ st.bad=0; if(st.drawn>LOW){ st.drawn=LOW; st.tier=1; } else if(st.drawn>LOW*0.6){ st.drawn=Math.floor(LOW*0.6); st.tier=2; } else { st.tier=3; спри(); return; } geo.setDrawRange(0,st.drawn); console.info('прах тир ↓',st.tier,st.drawn,Math.round(st.fps)+'fps'); } } } }
  requestAnimationFrame(кадър); }
function пусни(){ if(st.running||!st.visible||document.hidden||!renderer) return; st.running=true; st.last=0; st.pn=0; кадър(performance.now()); }
function спри(){ st.running=false; И.спри(); }
new IntersectionObserver(en=>{ st.visible=en.some(e=>e.isIntersecting); if(st.visible) пусни(); else st.running=false; },{threshold:0.05}).observe(stage);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) st.running=false; else пусни(); });
function размер(){ const w=Math.max(1,canvas.clientWidth),h=Math.max(1,canvas.clientHeight); renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); разположи(); }
new ResizeObserver(размер).observe(stage); размер();

/* ── API към драйвера + verify ── */
const api={
  смени(k,морф){ const цялоЛи=k==='цяло'; const o=цялоЛи?цяло(COUNT):облак(И.АРТЕФАКТИ[k].ключ,COUNT); st.k=k; st.арт=цялоЛи?И.ЦЯЛО:И.АРТЕФАКТИ[k]; палитра(st.арт); loadHome(o); st.sealed=!!И.сглобен(k); st.after=null; st.asm.on=false; st.asm.b=st.sealed?1:0;   /* нула стар печат от предишната карта */
    if(морф){ st.mor.v=0; tw(st.mor,1,1.3); st.after=цялоЛи?()=>tw(st.asm,1,1.6):(st.sealed?()=>tw(st.asm,1,0.6):()=>tw(st.asm,0.3,0.9)); }   /* частиците пътуват · после се разпускат до тапа */
    else { st.mor.v=1; st.mor.on=false; st.asm.on=false; st.asm.v=st.sealed?1:0; st.asm.b=st.asm.v; if(цялоЛи) tw(st.asm,1,1.6); }
    пусни(); },
  сглоби(ръчно){ if(st.sealed) return; st.ръчно=!!ръчно; tw(st.asm,1,1.4*(1-0.5*st.asm.v)); пусни(); },
  задръж(b){ st.focusT=b?1:0; },
  показалец(cx,cy){ const l=локал(cx,cy), now=performance.now(); if(st.pl){ const d=Math.hypot(l[0]-st.pl[0],l[1]-st.pl[1]), dt=Math.max(0.008,(now-st.pt)/1000); st.swirl=Math.min(1,st.swirl+Math.min(0.6,d/dt*0.08)); } st.pl=l; st.pt=now; U.uPointer.value.set(l[0],l[1]); },
  fps(){ return {fps:Math.round(st.fps), visible:document.visibilityState, running:st.running, drawn:st.drawn, tier:st.tier}; },
  info(){ return {ready:true, count:COUNT, active:nAct, drawn:st.drawn, tier:st.tier, mobile:IS_MOBILE, lowPower:LOW_POWER, dpr:DPR, three:THREE.REVISION, k:st.k, assembly:+st.asm.v.toFixed(3), morph:+st.mor.v.toFixed(3), focus:+st.focus.toFixed(2), sealed:st.sealed, art:[+U.uArt.value.x.toFixed(2),+U.uArt.value.y.toFixed(2),+U.uArt.value.z.toFixed(2)]}; },
  тир(k){ st.drawn=Math.max(1000,Math.min(COUNT,k|0)); geo.setDrawRange(0,st.drawn); return st.drawn; },
  проба(){ renderer.render(scene,camera); const gl=renderer.getContext(), w=gl.drawingBufferWidth, h=gl.drawingBufferHeight, bw=Math.floor(w*0.6), bh=Math.floor(h*0.5), buf=new Uint8Array(bw*bh*4); gl.readPixels(Math.floor(w*0.2),Math.floor(h*0.25),bw,bh,gl.RGBA,gl.UNSIGNED_BYTE,buf); let lit=0; for(let k=0;k<buf.length;k+=4){ if(buf[k]+buf[k+1]+buf[k+2]>40) lit++; } return {lit, of:bw*bh, w, h}; },
  загуби(){ const ext=renderer.getContext().getExtension('WEBGL_lose_context'); if(ext) ext.loseContext(); return !!ext; } };
canvas.addEventListener('webglcontextlost',e=>{ e.preventDefault(); спри(); },false);
canvas.addEventListener('webglcontextrestored',()=>{ И.рег(api); st.t0=0; пусни(); },false);
window.__прах=api; И.рег(api); пусни();
})();
</script>
</body>
