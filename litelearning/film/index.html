<html lang="bg">
<head>

<!--
  Филмова въртележка · MET-1276 (спек MET-1100 · ADR 0123)
  Двигател: engine.js = v2, байт-идентичен (md5 в controls/carousel/PASPORT.md т.1) · декор: decor-film.js · думи: config.js.
  Поток: покой → тап на Снимачна площадка (фокус · двамата Метагерои се сглобяват от прах) → тап на герой (пълни екрана) · „Назад“ връща към избора.
  Кожата на DOM-а живее тук: НЖ sep2026 токени в :root · площадката сменя само --accent.
  Пускане: python3 -m http.server 8899 --directory ~/metalandiaos → http://localhost:8899/_proto/film-carousel/ · гейт: python3 gate.py
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
<style>
:root{
  --bg:#0d0a08; --bg2:#15100c; --ink:#F0EBE0; --ink2:#d9d0bd; --mute:#a99e8a;
  --gold:#E8C77E; --gold3:#8a6a2e; --light:#fff5d6; --parch:#efe4c9; --parchink:#2a1f16;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;
  --accent:var(--gold);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--light);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
[hidden]{display:none!important}

#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{display:block;width:100%;height:100%;opacity:0;transition:opacity 1.2s ease}
.ready #gl{opacity:1}
.poster-art{display:none;position:absolute;inset:0;width:100%;height:100%}
.poster #gl{display:none}
.poster .poster-art{display:block}

/* площадките: 4 знака горе (екранен четец + клавиатура) */
.bulbs{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;align-items:center;gap:4px;z-index:3;transition:opacity .5s}
.bulbs i{display:none}
.bulbs button{width:44px;height:44px;display:grid;place-items:center}
.bulbs button::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--mute);opacity:.55;transition:all .4s}
.bulbs button.cur::before{width:30px;background:var(--accent);opacity:1;box-shadow:0 0 12px var(--accent)}
body[data-hero] .bulbs{opacity:0;pointer-events:none}

/* назад: от фокус → към течащата въртележка · от избран герой → към площадката */
.back{position:fixed;top:max(14px,env(safe-area-inset-top));left:10px;z-index:6;width:48px;height:48px;border-radius:50%;font:500 30px/1 var(--serif);color:var(--light);
  background:color-mix(in srgb,var(--bg2) 70%,transparent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);opacity:0;pointer-events:none;transition:opacity .4s}
.s-focus .back,.s-open .back{opacity:1;pointer-events:auto}
#veil{position:fixed;inset:0;z-index:4;display:none}
.s-open #veil{display:block}

/* двамата Метагерои на площадката във фокус: истински бутони (тап · клавиатура · четец) */
#pick{position:fixed;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .5s,transform .5s}
.s-focus #pick,.s-open #pick{opacity:1;pointer-events:auto;transform:none}
body[data-hero] #pick{opacity:0;pointer-events:none}
#pick div{display:flex;gap:12px;padding:0 14px;width:min(100%,440px)}
#pick button{flex:1 1 0;min-width:0;min-height:76px;padding:10px 6px;border-radius:14px;background:color-mix(in srgb,var(--bg2) 78%,transparent);border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#pick b{font:600 26px/1.1 var(--serif);color:var(--light)}
#pick span{font:500 17px/1.2 var(--sans);color:var(--accent);letter-spacing:.02em}

/* избраният Метагерой пълни екрана: прахът е в сцената · тук са името и продукцията */
#hero{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px max(64px,env(safe-area-inset-bottom));text-align:center;pointer-events:none;opacity:0;transition:opacity .7s .25s;
  background:linear-gradient(to top,color-mix(in srgb,var(--bg) 88%,transparent),transparent 34%)}
body[data-hero] #hero{opacity:1}
#hero h1{font:600 56px/1.02 var(--serif);color:var(--light);text-shadow:0 0 28px color-mix(in srgb,var(--accent) 60%,transparent);text-wrap:balance}
#hero p{margin-top:8px;font:500 20px/1.2 var(--sans);color:var(--accent);letter-spacing:.06em}
.hero-art{display:none}
.poster .hero-art{display:block;flex:1 1 auto;min-height:0;width:100%;margin:96px 0 18px}
.hero-art canvas{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--accent) 55%,transparent))}
.poster[data-hero] #hero{background:color-mix(in srgb,var(--bg) 94%,transparent)}
@media (min-width:900px){
  .s-open #hero,.s-open #pick{left:auto;right:0;width:min(540px,44vw)}
  #hero{justify-content:center;padding-bottom:0;background:none}
  #hero h1{font-size:76px}
}

/* постер (намалено движение / без WebGL): площадките са карти в ред · изборът работи */
.prail{position:fixed;left:0;right:0;bottom:calc(max(26px,env(safe-area-inset-bottom)) + 96px);z-index:3;display:flex;gap:12px;padding:0 9vw;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.prail::-webkit-scrollbar{display:none}
.pcard{flex:0 0 82vw;max-width:360px;min-height:132px;scroll-snap-align:center;padding:20px 14px;border-radius:16px;background:color-mix(in srgb,var(--bg2) 86%,transparent);border:1px solid var(--gold3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pcard b{font:600 28px/1.1 var(--serif);color:var(--light)}
.pcard span{font:500 17px/1.3 var(--sans);color:var(--gold)}
.pcard em{display:none}
.poster.s-open .prail{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="s-flow">

<div id="stage" role="img">
  <canvas id="gl" aria-hidden="true"></canvas>
  <svg class="poster-art" viewBox="0 0 375 812" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="pb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C77E" stop-opacity=".5"/><stop offset="1" stop-color="#E8C77E" stop-opacity="0"/></linearGradient>
      <radialGradient id="pp"><stop offset="0" stop-color="#E8C77E" stop-opacity=".42"/><stop offset="1" stop-color="#E8C77E" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="375" height="812" fill="#0d0a08"/>
    <path d="M70 70 L-40 470 H200 Z" fill="url(#pb)"/><path d="M305 50 L175 470 H415 Z" fill="url(#pb)" opacity=".7"/>
    <path d="M176 470 L120 40 H255 L199 470 Z" fill="url(#pb)" opacity=".55"/>
    <g fill="#2a1f16"><rect x="56" y="52" width="30" height="24" rx="3"/><rect x="69" y="76" width="3" height="330"/><rect x="290" y="34" width="30" height="24" rx="3"/><rect x="303" y="58" width="3" height="350"/></g>
    <ellipse cx="187" cy="476" rx="230" ry="60" fill="url(#pp)"/>
    <ellipse cx="187" cy="470" rx="168" ry="34" fill="#15100c" stroke="#E8C77E" stroke-width="1.5"/>
    <ellipse cx="187" cy="482" rx="204" ry="44" fill="none" stroke="#8a6a2e" stroke-width="2"/><ellipse cx="187" cy="485" rx="218" ry="49" fill="none" stroke="#8a6a2e" stroke-width="2"/>
  </svg>
</div>

<nav class="bulbs"></nav>
<button class="back" type="button">‹</button>
<div id="veil"></div>
<nav id="pick"></nav>
<section id="hero" aria-live="polite"><div class="hero-art"></div><h1></h1><p></p></section>
<p id="live" class="sr" aria-live="polite"></p>

<!-- договорът на двигателя с DOM-а: картите (= площадките) живеят в #sheet · листът, менюто и наградата не се показват (без обиколка · без награда) -->
<section class="sheet" id="sheet" aria-hidden="true" hidden>
  <div class="sheet-head"><button class="prev" type="button"></button><div class="sheet-dots"></div><button class="next" type="button"></button><button class="x" type="button"></button></div>
  <div class="sheet-body"></div>
</section>
<button class="more" type="button" hidden></button><button class="menu-btn" type="button" hidden></button><nav id="menu" hidden></nav><aside id="reward" hidden></aside>

<script type="module">
import { mount } from './engine.js';
import decor from './decor-film.js';
import config from './config.js';

const $ = s => document.querySelector(s), body = document.body, root = document.documentElement;
const join = (set, key) => set.heroes.map(h => h[key]).join(' · ');
$('#stage').setAttribute('aria-label', config.ui.stage); $('.bulbs').setAttribute('aria-label', config.ui.sets); $('#pick').setAttribute('aria-label', config.ui.heroes); $('.back').setAttribute('aria-label', config.ui.back);
$('.sheet-body').innerHTML = config.sets.map(s => `<article id="${s.id}" data-title="${join(s, 'name')}" data-teaser="${join(s, 'production')}" data-accent="${s.accent}" data-heroes="${s.heroes.map(h => [h.id, h.name, h.production].join(':')).join('|')}"></article>`).join('');
$('#pick').innerHTML = config.sets.map(s => `<div data-set="${s.id}" hidden>${s.heroes.map(h => `<button type="button" data-hero="${h.id}"><b>${h.name}</b><span>${h.production}</span></button>`).join('')}</div>`).join('');

mount({ decor });                       // двигателят не се пипа · декорът и думите идват отвън
const P = window.__proto, groups = [...document.querySelectorAll('#pick div')];
let tap = null, down = null, wasOpen = false, openedAt = 0;

function choose(set, h) {               // избран Метагерой → пълни екрана · събитието носи героя и площадката
  body.dataset.hero = h.id; $('#hero h1').textContent = h.name; $('#hero p').textContent = h.production;
  if (body.classList.contains('poster')) $('.hero-art').replaceChildren(decor.paintHero(h.id, set.accent, getComputedStyle(root).getPropertyValue('--light').trim()));
  if (P.state().mode !== 'open') P.open(config.sets.indexOf(set));
  $('.back').focus({ preventScroll: true });
  dispatchEvent(new CustomEvent('metahero', { detail: { hero: h.id, set: set.id } }));
}
function back() {                       // връщане без close() на двигателя → няма обиколка и награда
  const st = P.state(), poster = body.classList.contains('poster');
  if (body.dataset.hero) { delete body.dataset.hero; if (!poster) P.focus(st.idx); else sync(); }
  else if (st.mode === 'open') P.focus(st.idx);
  else P.flow();
}
function sync() {
  const st = P.state(), held = st.mode === 'focus' || st.mode === 'open', set = held ? config.sets[st.idx] : null;
  if (st.mode !== 'open' && body.dataset.hero) delete body.dataset.hero;
  root.style.setProperty('--accent', set ? set.accent : 'var(--gold)');
  groups.forEach(g => { g.hidden = !set || g.dataset.set !== set.id; });
  if (st.mode === 'open' && !wasOpen && tap && tap.i === st.idx && performance.now() - tap.t < 500) choose(set, set.heroes[tap.side]);
  if (st.mode === 'open' && !wasOpen) openedAt = performance.now();
  wasOpen = st.mode === 'open'; tap = null;
}
new MutationObserver(sync).observe(body, { attributes: true, attributeFilter: ['class'] });
$('#pick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const set = config.sets[P.state().idx]; choose(set, set.heroes.find(h => h.id === b.dataset.hero)); });
$('.back').addEventListener('click', back); $('#veil').addEventListener('click', () => { if (performance.now() - openedAt > 500) back(); });   // тапът, който отвори, носи и click → не го броим
addEventListener('keydown', e => { if (e.key === 'Escape' && P.state().mode === 'open') { e.stopImmediatePropagation(); back(); } }, true);
/* тап върху героя в кадъра: лявата половина = първият, дясната = вторият (двигателят отваря площадката, тук се избира кой) */
addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; }, true);
addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 9 || !e.target.closest('#stage')) return;
  const st = P.state(); if (st.mode === 'focus') tap = { i: st.idx, side: e.clientX < innerWidth / 2 ? 0 : 1, t: performance.now() };
}, true);
sync();
</script>
</body>
</html>
